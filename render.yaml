services:
  - type: web
    name: vibe-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: PGSSL
        value: true
      - key: DATABASE_URL
        sync: false
      - key: ANDROID_PACKAGE_NAME
        value: com.vibe.app
